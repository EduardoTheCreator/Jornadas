<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornadas FE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 1rem 0;
        }
        section {
            margin: 2rem;
        }
        img {
            max-width: 80%;
            height: auto;
            border-radius: 8px;
            margin: 1rem 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        footer {
            margin-top: 2rem;
            padding: 1rem;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>🌐 Jornadas FE 2025</h1>
        <p>Innovación, tecnología y futuro en Alicante</p>
    </header>

    <section>
        <h2>🔎 Infografía Destacada</h2>
        <img src="infografia.png" alt="Infografía de las jornadas">
    </section>

    <section>
        <h2>☁️ Nube de Conceptos</h2>
        <img src="wordcloud.png" alt="Nube de conceptos">
    </section>

    <section>
        <h2>🎯 Logotipo Oficial</h2>
        <img src="logotipo.png" alt="Logotipo de las jornadas">
    </section>

    <footer>
        <p>© 2025 Jornadas FE | Publicado en Github Pages</p>
    </footer>
</body>
</html>
